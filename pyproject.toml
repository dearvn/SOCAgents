[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "socagents"
dynamic = ["version"]
description = "Open-source multi-agent desk for options and futures flow. The LLM proposes; deterministic code disposes."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "SOCAgents contributors" }]
keywords = ["agents", "llm", "multi-agent", "options", "futures", "trading", "gex", "mcp"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "cryptography>=42",
    "httpx>=0.27",
    "keyring>=25",
    "pydantic>=2.7,<3",
    "rich>=13.7",
    "river>=0.21,<1",
    "typer>=0.12",
    "tzdata; sys_platform == 'win32'",
]

[project.optional-dependencies]
mcp = ["mcp>=2.2,<3"]
dev = [
    "mcp>=2.2,<3",
    "mypy>=1.11",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[project.scripts]
socagents = "socagents.cli.main:main"

[project.urls]
Homepage = "https://github.com/dearvn/SOCAgents"
Documentation = "https://github.com/dearvn/SOCAgents/tree/main/docs"
Issues = "https://github.com/dearvn/SOCAgents/issues"

[tool.hatch.version]
path = "socagents/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["socagents"]

[tool.hatch.build.targets.sdist]
include = ["socagents", "tests", "scripts", "docs", "README.md", "LICENSE"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["docs", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
allowed-confusables = ["–", "−", "×"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["socagents"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
