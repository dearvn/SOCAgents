# Copy, fill in, and apply. Never commit the filled-in copy.
#   cp deploy/k8s/x-flow-secret.template.yaml /tmp/x-flow-secret.yaml && $EDITOR /tmp/x-flow-secret.yaml
#   kubectl apply -f /tmp/x-flow-secret.yaml && rm /tmp/x-flow-secret.yaml
apiVersion: v1
kind: Secret
metadata:
  name: socagents-x-flow
type: Opaque
stringData:
  # OAuth 1.0a, from the X app's "Keys and tokens" tab (Read and write permission).
  X_API_KEY: "CHANGE_ME"
  X_API_SECRET: "CHANGE_ME"
  X_ACCESS_TOKEN: "CHANGE_ME"
  X_ACCESS_TOKEN_SECRET: "CHANGE_ME"
  # A role that can only SELECT from market_pressure_aggregates. See docs/x-bot.md.
  FLOW_DATABASE_URL: "postgresql://flow_reader:CHANGE_ME@DB_HOST:5432/DB_NAME"
  # Discord channel → Edit Channel → Integrations → Webhooks → Copy Webhook URL.
  # Read by discord-flow-cronjob.pip.yaml.
  DISCORD_FLOW_WEBHOOK_URL: "https://discord.com/api/webhooks/CHANGE_ME/CHANGE_ME"
